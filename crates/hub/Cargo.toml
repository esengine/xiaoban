[package]
name = "xiaoban-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "xiaoban-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.23.1"
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
calamine = { version = "0.37", default-features = false }
encoding_rs = "0.8"
docx-rs = "0.4"
rust_xlsxwriter = "0.92"
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
if-addrs.workspace = true
ignore = "0.4.34"
jiff.workspace = true
keyring.workspace = true
mdns-sd.workspace = true
pdf-extract = { version = "0.12", default-features = false }
regex = "1.13.1"
reqwest = { workspace = true, features = ["query"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "3.2.1"
sys-locale.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
xiaoban-agent.workspace = true
xiaoban-i18n.workspace = true
xiaoban-protocol.workspace = true
xiaoban-store.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
xiaoban-i18n.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
