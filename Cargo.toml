[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
xiaoban-protocol = { path = "crates/protocol" }
xiaoban-store = { path = "crates/store" }
xiaoban-agent = { path = "crates/agent" }
xiaoban-hub = { path = "crates/hub" }
xiaoban-i18n = { path = "crates/i18n" }

anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
if-addrs = "0.15"
jiff = "0.2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
mdns-sd = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unic-langid = "0.9"
ts-rs = "12"
uuid = { version = "1.29", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
