[package]
name = "xiaoban-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "xiaoban_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tracing.workspace = true
tracing-subscriber.workspace = true
xiaoban-agent.workspace = true
xiaoban-hub.workspace = true
xiaoban-i18n.workspace = true
xiaoban-protocol.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-core-location = "0.3"
objc2-foundation = "0.3"

[lints]
workspace = true
