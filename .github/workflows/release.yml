name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android app (skip the desktop installers)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JavaScript dependencies
        run: |
          printf '\nnodeLinker: hoisted\n' >> pnpm-workspace.yaml
          pnpm install --frozen-lockfile
      - name: Build the hub library
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          cargo build -p xiaoban-mobile --release --target aarch64-linux-android
          JNI=apps/mobile/modules/xiaoban-hub/android/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          cp target/aarch64-linux-android/release/libxiaoban_mobile.so "$JNI/"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prebuild
        working-directory: apps/mobile
        env:
          CI: "1"
        run: node ../../node_modules/expo/bin/cli prebuild -p android --no-install
      - name: Build signed APK and bundle
        working-directory: apps/mobile/android
        env:
          XIAOBAN_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          XIAOBAN_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          XIAOBAN_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_ALIAS }}
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE is not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          export XIAOBAN_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/xiaoban-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/xiaoban-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" out/* --clobber

  desktop:
    name: Desktop (${{ matrix.name }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.android_only) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apple notarization key
        if: matrix.name == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::APPLE_API_KEY_P8 is not set; the app will not be notarized"
            exit 0
          fi
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
      - name: Notarize the disk image
        if: matrix.name == 'macOS' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for dmg in target/*/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          done
      - name: Replace the release disk image
        if: matrix.name == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/*/release/bundle/dmg/*.dmg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
